services:
  gateway:
    build: .
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    read_only: true
    ports:
      - "${GATEWAY_BIND_ADDRESS:-127.0.0.1}:443:443/tcp"
    volumes:
      - gateway-state:/var/lib/xconnect-gateway
      - "${GATEWAY_TLS_DIR:?Set GATEWAY_TLS_DIR to the provisioned TLS directory}:/etc/xconnect-gateway:ro"
volumes:
  gateway-state:
